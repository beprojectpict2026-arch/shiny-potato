<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Forensics Tool</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c2330; --muted:#667085; --line:#e3e6ec; --accent:#2457d6;
          --bad:#b42318; --badbg:#fef0ee; --good:#067647; --goodbg:#e8f6ee; --sel:#eaf0ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --text:#e8ebf1; --muted:#98a2b3; --line:#2b3240; --accent:#7ea2ff;
            --bad:#ff9a8f; --badbg:#3a1d1a; --good:#6ddba0; --goodbg:#16301f; --sel:#232c44; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 4px; font-size:26px; }
  h2 { font-size:17px; margin:0 0 10px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .bar span { color:var(--muted); font-size:14px; }
  button, .upload { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 20px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .upload input { display:none; }
  select { padding:9px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; max-width:100%; }
  #list { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px; margin-top:14px; }
  .thumb { border:2px solid var(--line); border-radius:10px; padding:8px; text-align:center; cursor:pointer; font-size:13px; overflow-wrap:anywhere; }
  .thumb.on { border-color:var(--accent); background:var(--sel); }
  .thumb img { width:100%; height:100px; object-fit:contain; border-radius:6px; display:block; margin-bottom:6px; background:var(--bg); }
  #verdict { display:inline-block; padding:6px 14px; border-radius:999px; font-weight:700; }
  .bad { background:var(--badbg); color:var(--bad); }
  .good { background:var(--goodbg); color:var(--good); }
  table { width:100%; border-collapse:collapse; }
  td { padding:8px 4px; border-top:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  td:first-child { width:190px; color:var(--muted); }
  ul { margin:0; padding-left:20px; }
  li { margin-bottom:6px; color:var(--bad); }
  .hidden { display:none; }
</style></head>
<body><main>
  <h1>Image Forensics Tool</h1>
  <p class="sub">Upload an image or pick one from the images folder, then click Analyse.</p>

  <div class="card">
    <div class="bar">
      <label class="upload">Upload image<input type="file" id="file" accept="image/*"></label>
      <span id="msg">Uploaded images are saved in the images/ folder.</span>
    </div>
    <div id="list"></div>
  </div>

  <div class="card bar">
    <label for="original">Compare with original <span>(optional)</span></label>
    <select id="original"></select>
    <button id="go" disabled>Analyse</button>
  </div>

  <div id="result" class="hidden">
    <div class="card">
      <p><span id="verdict"></span></p>
      <table id="facts"></table>
    </div>
    <div class="card"><h2>Findings</h2><div id="findings"></div></div>
    <div class="card hidden" id="cmpcard"><h2>Comparison with original</h2><table id="cmp"></table></div>
  </div>
  <p id="error" class="hidden bad card"></p>
</main>
<script>
const $ = id => document.getElementById(id);
let chosen = "";

const row = (table, key, value) => {
  const tr = table.insertRow();
  tr.insertCell().textContent = key;
  tr.insertCell().textContent = value;
};

async function loadImages() {
  const names = await (await fetch("/images")).json();
  const previous = $("original").value;
  $("list").innerHTML = "";
  $("original").innerHTML = '<option value="">None</option>';
  names.forEach(name => {
    const div = document.createElement("div");
    div.className = "thumb" + (name === chosen ? " on" : "");
    const img = document.createElement("img");
    img.src = "/images/" + encodeURIComponent(name);
    div.append(img, name);
    div.onclick = () => { chosen = name; $("go").disabled = false; loadImages(); };
    $("list").append(div);
    $("original").add(new Option(name, name));
  });
  $("original").value = previous;
}

$("file").onchange = async () => {
  const file = $("file").files[0];
  if (!file) return;
  const res = await fetch("/upload?name=" + encodeURIComponent(file.name), { method: "POST", body: file });
  const data = await res.json();
  $("msg").textContent = data.error ? data.error : "Saved as images/" + data.name;
  if (!data.error) { chosen = data.name; $("go").disabled = false; }
  $("file").value = "";
  loadImages();
};

$("go").onclick = async () => {
  $("go").disabled = true;
  const body = { name: chosen, original: $("original").value };
  const res = await (await fetch("/analyse", { method: "POST", body: JSON.stringify(body) })).json();
  $("go").disabled = false;

  $("error").classList.toggle("hidden", !res.error);
  $("result").classList.toggle("hidden", !!res.error);
  if (res.error) { $("error").textContent = "Could not analyse this file: " + res.error; return; }

  const r = res.report, bad = r.findings.length > 0;
  $("verdict").textContent = bad ? "SUSPICIOUS" : "No anomalies found";
  $("verdict").className = bad ? "bad" : "good";
  $("facts").innerHTML = "";
  row($("facts"), "File", r.file);
  row($("facts"), "Type", r.type + " (" + r.size + " bytes)");
  if (r.info.width) row($("facts"), "Dimensions", r.info.width + " x " + r.info.height);
  row($("facts"), "SHA-256", r.sha256);
  row($("facts"), "MD5", r.md5);
  const meta = Object.entries(r.metadata).map(([k, v]) => k + ": " + v).join(" | ");
  row($("facts"), "Metadata", meta || "none");
  if (r.note) row($("facts"), "Note", r.note);

  $("findings").innerHTML = "";
  if (bad) {
    const ul = document.createElement("ul");
    r.findings.forEach(f => { const li = document.createElement("li"); li.textContent = f; ul.append(li); });
    $("findings").append(ul);
  } else $("findings").textContent = "Nothing unusual found.";

  $("cmpcard").classList.toggle("hidden", !res.comparison);
  if (res.comparison) {
    $("cmp").innerHTML = "";
    const c = res.comparison;
    if (c.error) row($("cmp"), "Result", c.error);
    else {
      row($("cmp"), "Identical file", c.identical_hash ? "Yes (same hash)" : "No (hash differs)");
      row($("cmp"), "Changed pixel values", c.changed_values);
      row($("cmp"), "Largest change", c.max_difference);
    }
  }
};

loadImages();
</script></body></html>
