<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Forensics Tool</title>
<style>
  :root { --text:#111827; --muted:#6b7280; --line:#e5e7eb; --soft:#f9fafb; --accent:#1d4ed8; --accent-soft:#eff6ff;
          --bad:#b91c1c; --bad-soft:#fef2f2; --good:#15803d; --good-soft:#f0fdf4; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--text); font:15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { border-bottom:1px solid var(--line); }
  .wrap { max-width:920px; margin:0 auto; padding:0 20px; }
  header .wrap { padding-top:28px; padding-bottom:22px; }
  h1 { margin:0; font-size:22px; font-weight:650; letter-spacing:-.01em; }
  .sub { margin:4px 0 0; color:var(--muted); }
  main.wrap { padding-top:28px; padding-bottom:64px; }
  section { margin-bottom:32px; }
  h2 { margin:0 0 12px; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .hint { color:var(--muted); font-size:13px; }
  button, .upload { display:inline-block; background:var(--accent); color:#fff; border:1px solid var(--accent); border-radius:6px;
                    padding:8px 18px; font:inherit; font-weight:550; cursor:pointer; }
  button:hover:not(:disabled), .upload:hover { background:#1e40af; border-color:#1e40af; }
  button:disabled { background:#e5e7eb; border-color:#e5e7eb; color:#9ca3af; cursor:not-allowed; }
  .upload { background:#fff; color:var(--text); border-color:#d1d5db; }
  .upload:hover { background:var(--soft); border-color:#9ca3af; }
  .upload input { display:none; }
  select { padding:8px 10px; border:1px solid #d1d5db; border-radius:6px; background:#fff; color:var(--text); font:inherit; max-width:100%; }
  #list { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; margin-top:16px; }
  .thumb { border:1px solid var(--line); border-radius:8px; padding:8px; cursor:pointer; font-size:13px; text-align:center; overflow-wrap:anywhere; background:#fff; }
  .thumb:hover { border-color:#9ca3af; }
  .thumb.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); background:var(--accent-soft); }
  .thumb img { width:100%; height:100px; object-fit:contain; display:block; margin-bottom:6px; background:var(--soft); border-radius:4px; }
  .report { border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:16px; }
  .report-head { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--soft); }
  .report-head strong { font-weight:600; }
  #verdict { padding:3px 12px; border-radius:999px; font-size:13px; font-weight:600; }
  #verdict.bad { background:var(--bad-soft); color:var(--bad); }
  #verdict.good { background:var(--good-soft); color:var(--good); }
  table { width:100%; border-collapse:collapse; }
  td { padding:10px 18px; border-top:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  tr:first-child td { border-top:0; }
  td:first-child { width:190px; color:var(--muted); overflow-wrap:normal; }
  .body { padding:14px 18px; }
  ul { margin:0; padding-left:20px; }
  li { margin-bottom:4px; color:var(--bad); }
  .ok { color:var(--good); }
  #error { border:1px solid #fecaca; background:var(--bad-soft); color:var(--bad); border-radius:8px; padding:12px 18px; }
  .hidden { display:none; }
  @media (max-width:560px) { td:first-child { width:120px; } }
</style></head>
<body>
<header><div class="wrap">
  <h1>Image Forensics Tool</h1>
  <p class="sub">Check an image for tampering, hidden data and editing traces.</p>
</div></header>

<main class="wrap">
  <section>
    <h2>1. Select an image</h2>
    <div class="row">
      <label class="upload">Upload image<input type="file" id="file" accept="image/*"></label>
      <span class="hint" id="msg">Uploaded images are saved in the images/ folder.</span>
    </div>
    <div id="list"></div>
  </section>

  <section>
    <h2>2. Compare with an original (optional)</h2>
    <div class="row">
      <select id="original"></select>
      <button id="go" disabled>Analyse</button>
      <span class="hint" id="gohint">Select an image first.</span>
    </div>
  </section>

  <section id="result" class="hidden">
    <h2>Report</h2>
    <div class="report">
      <div class="report-head"><strong id="title"></strong><span id="verdict"></span></div>
      <table id="facts"></table>
    </div>
    <div class="report">
      <div class="report-head"><strong>Findings</strong></div>
      <div class="body" id="findings"></div>
    </div>
    <div class="report hidden" id="cmpcard">
      <div class="report-head"><strong>Comparison with original</strong></div>
      <table id="cmp"></table>
    </div>
  </section>
  <p id="error" class="hidden"></p>
</main>
<script>
const $ = id => document.getElementById(id);
let chosen = "";

const row = (table, key, value) => {
  const tr = table.insertRow();
  tr.insertCell().textContent = key;
  tr.insertCell().textContent = value;
};

function select(name) {
  chosen = name;
  $("go").disabled = false;
  $("gohint").textContent = "Selected: " + name;
  loadImages();
}

async function loadImages() {
  const names = await (await fetch("/images")).json();
  const previous = $("original").value;
  $("list").innerHTML = "";
  $("original").innerHTML = '<option value="">No comparison</option>';
  names.forEach(name => {
    const div = document.createElement("div");
    div.className = "thumb" + (name === chosen ? " on" : "");
    const img = document.createElement("img");
    img.src = "/images/" + encodeURIComponent(name);
    div.append(img, name);
    div.onclick = () => select(name);
    $("list").append(div);
    $("original").add(new Option(name, name));
  });
  $("original").value = previous;
}

$("file").onchange = async () => {
  const file = $("file").files[0];
  if (!file) return;
  const res = await fetch("/upload?name=" + encodeURIComponent(file.name), { method: "POST", body: file });
  const data = await res.json();
  $("msg").textContent = data.error ? data.error : "Saved as images/" + data.name;
  $("file").value = "";
  if (data.error) loadImages(); else select(data.name);
};

$("go").onclick = async () => {
  $("go").disabled = true;
  const body = { name: chosen, original: $("original").value };
  const res = await (await fetch("/analyse", { method: "POST", body: JSON.stringify(body) })).json();
  $("go").disabled = false;

  $("error").classList.toggle("hidden", !res.error);
  $("result").classList.toggle("hidden", !!res.error);
  if (res.error) { $("error").textContent = "Could not analyse this file: " + res.error; return; }

  const r = res.report, bad = r.findings.length > 0;
  $("title").textContent = r.file;
  $("verdict").textContent = bad ? "Suspicious" : "No anomalies found";
  $("verdict").className = bad ? "bad" : "good";
  $("facts").innerHTML = "";
  row($("facts"), "Type", r.type + " (" + r.size + " bytes)");
  if (r.info.width) row($("facts"), "Dimensions", r.info.width + " x " + r.info.height);
  row($("facts"), "SHA-256", r.sha256);
  row($("facts"), "MD5", r.md5);
  const meta = Object.entries(r.metadata).map(([k, v]) => k + ": " + v).join(" | ");
  row($("facts"), "Metadata", meta || "none");
  if (r.note) row($("facts"), "Note", r.note);

  $("findings").innerHTML = "";
  if (bad) {
    const ul = document.createElement("ul");
    r.findings.forEach(f => { const li = document.createElement("li"); li.textContent = f; ul.append(li); });
    $("findings").append(ul);
  } else {
    $("findings").textContent = "Nothing unusual found.";
    $("findings").className = "body ok";
  }
  if (bad) $("findings").className = "body";

  $("cmpcard").classList.toggle("hidden", !res.comparison);
  if (res.comparison) {
    $("cmp").innerHTML = "";
    const c = res.comparison;
    if (c.error) row($("cmp"), "Result", c.error);
    else {
      row($("cmp"), "Identical file", c.identical_hash ? "Yes (same hash)" : "No (hash differs)");
      row($("cmp"), "Changed pixel values", c.changed_values);
      row($("cmp"), "Largest change", c.max_difference);
    }
  }
};

loadImages();
</script></body></html>
